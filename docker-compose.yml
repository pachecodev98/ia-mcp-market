services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: loja-faex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lojafaex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lojafaex123}
      POSTGRES_DB: ${POSTGRES_DB:-lojafaex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lojafaex} -d ${POSTGRES_DB:-lojafaex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loja-faex-network

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: loja-faex-back
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FRONT_URL: ${FRONT_URL:-http://localhost:5173}
    ports:
      - "${BACK_PORT:-3000}:3000"
    networks:
      - loja-faex-network

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: loja-faex-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-5173}:80"
    depends_on:
      - back
    networks:
      - loja-faex-network

volumes:
  postgres_data:

networks:
  loja-faex-network:
    driver: bridge
